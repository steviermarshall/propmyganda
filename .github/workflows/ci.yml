name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Lint is currently informational: the codebase has a backlog of
      # no-explicit-any violations being cleaned up. Flip to a hard gate
      # once that lands.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
